[package]
name = "music-share-desktop"
version = "1.0.1"
edition = "2021"
rust-version = "1.90"

[lib]
name = "music_share_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "music-share-desktop"
required-features = ["desktop"]

[features]
default = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:souvlaki", "dep:windows", "dep:tauri-plugin-updater"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libloading = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
tauri = { version = "2", optional = true , features = ["tray-icon"] }
tauri-plugin-updater = { version = "2", optional = true }
md-5 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
souvlaki = { version = "0.8.3", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
