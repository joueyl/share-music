[package]
name = "music-share-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "music_share_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "music-share-desktop"
required-features = ["desktop"]

[features]
default = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libloading = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
tauri = { version = "2", optional = true , features = [] }
rfd = { version = "0.17", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
