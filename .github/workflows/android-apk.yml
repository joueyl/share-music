name: Android APK (experimental)

# Independent APK UI; never attached to desktop release aggregation.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'packages/shared/**'
      - 'apps/server/**'
      - 'package.json'
      - 'scripts/*android*'
      - 'scripts/*apk*'
      - '.github/workflows/android-apk.yml'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run apps/client/test
      - run: node --test scripts/apk-entry.test.mjs scripts/configure-android-sdk.test.mjs
      - run: npm run build -w @music-share/client
      - run: npm run build:apk
      - run: node scripts/check-apk-build.mjs
  apk:
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      NDK_VERSION: '27.2.12479018'
      ANDROID_API_LEVEL: '36'
      BUILD_TOOLS_VERSION: '36.0.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate Android readiness, version and server URL
        id: release
        env:
          CLIENT_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: node scripts/ci-android.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-$ANDROID_API_LEVEL" "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install Rust Android target
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustup target add aarch64-linux-android
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: android-rust-v1
          workspaces: apps/client/src-tauri -> target
          key: android-arm64-${{ env.NDK_VERSION }}
          cache-bin: 'false'
          cache-workspace-crates: 'false'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Generate experimental Android shell
        working-directory: apps/client
        run: |
          set -euo pipefail
          npm run tauri -- android init --ci --skip-targets-install
      - name: Pin generated project to the installed stable Android SDK
        run: |
          set -euo pipefail
          node scripts/configure-android-sdk.mjs
      - name: Build ARM64 debug APK with automatic debug signing
        working-directory: apps/client
        run: |
          set -euo pipefail
          npm run tauri -- android build --ci --debug --apk --target aarch64 --config src-tauri/tauri.android.conf.json
          node ../../scripts/check-apk-build.mjs
      - name: Verify and collect debug APK
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find apps/client/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -path '*/debug/*' -print0)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one ARM64 debug APK; refusing missing or ambiguous outputs'
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          mkdir -p release-artifacts
          output="release-artifacts/music-share-$RELEASE_VERSION-android-arm64-debug.apk"
          # Preserve Gradle's automatic debug signature; do not re-sign or modify the APK.
          cp -- "${apks[0]}" "$output"
          "$tools/apksigner" verify --verbose "$output"
          "$tools/zipalign" -c 4 "$output"
          (cd release-artifacts && sha256sum "music-share-$RELEASE_VERSION-android-arm64-debug.apk" > SHA256SUMS-android-arm64-debug.txt)
          cp -- apps/client/dist-apk/client-target.json release-artifacts/client-target.json
          printf '%s\n' 'Independent APK UI — DEBUG TEST BUILD, not for production distribution.' 'Each fresh runner may generate a different debug key; uninstall may be required to replace a previous build (local data will be lost).' > release-artifacts/DEBUG-BUILD.txt
          node scripts/version.mjs --notes "$RELEASE_VERSION" > release-artifacts/RELEASE-NOTES.md
      - name: Upload debug APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: music-share-android-arm64-debug-${{ steps.release.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
