name: Android APK (experimental)

# Deliberately independent of desktop tags and release aggregation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      NDK_VERSION: '27.2.12479018'
      BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate Android readiness, version and server URL
        id: release
        env:
          CLIENT_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: node scripts/ci-android.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install Rust Android target
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustup target add aarch64-linux-android
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: android-rust-v1
          workspaces: apps/client/src-tauri -> target
          key: android-arm64-${{ env.NDK_VERSION }}
          cache-bin: 'false'
          cache-workspace-crates: 'false'
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Generate experimental Android shell
        working-directory: apps/client
        run: |
          set -euo pipefail
          npm run tauri -- android init --ci --skip-targets-install
      - name: Install SDK platform required by the locked CLI template
        run: |
          set -euo pipefail
          sdk=$(sed -nE 's/^[[:space:]]*compileSdk = ([0-9]+)[[:space:]]*$/\1/p' apps/client/src-tauri/gen/android/app/build.gradle.kts)
          [[ "$sdk" =~ ^[0-9]+$ ]] || { echo '::error::Unable to determine generated compileSdk'; exit 1; }
          sdkmanager "platforms;android-$sdk"
      - name: Build ARM64 debug APK with automatic debug signing
        working-directory: apps/client
        run: |
          set -euo pipefail
          npm run tauri -- android build --ci --debug --apk --target aarch64
      - name: Verify and collect debug APK
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find apps/client/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -path '*/debug/*' -print0)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one ARM64 debug APK; refusing missing or ambiguous outputs'
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          mkdir -p release-artifacts
          output="release-artifacts/music-share-$RELEASE_VERSION-android-arm64-debug.apk"
          # Preserve Gradle's automatic debug signature; do not re-sign or modify the APK.
          cp -- "${apks[0]}" "$output"
          "$tools/apksigner" verify --verbose "$output"
          "$tools/zipalign" -c 4 "$output"
          (cd release-artifacts && sha256sum "music-share-$RELEASE_VERSION-android-arm64-debug.apk" > SHA256SUMS-android-arm64-debug.txt)
          printf '%s\n' 'DEBUG TEST BUILD — not for production distribution.' 'Each fresh runner may generate a different debug key; uninstall may be required to replace a previous build (local data will be lost).' > release-artifacts/DEBUG-BUILD.txt
          node scripts/version.mjs --notes "$RELEASE_VERSION" > release-artifacts/RELEASE-NOTES.md
      - name: Upload debug APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: music-share-android-arm64-debug-${{ steps.release.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
