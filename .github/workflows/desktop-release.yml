name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate version, tag and public server URL
        id: release
        env:
          CLIENT_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/ci-release.mjs prepare
      - name: Install dependencies and run JavaScript tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run test:version
          npm run test:ci-release
          npm run test:updater
          npm run test:desktop-launcher
          npm run test:packaging
          npm test
      - name: Install Rust
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - name: Cache Cargo downloads and Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: desktop-rust-v1
          workspaces: apps/client/src-tauri -> target
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-${{ hashFiles('apps/client/src-tauri/Cargo.lock') }}
          env-vars: CARGO CC CFLAGS CXX RUST MACOSX_DEPLOYMENT_TARGET
          cache-targets: 'true'
          cache-workspace-crates: 'false'
          cache-bin: 'false'
          cache-on-failure: 'true'
      - name: Package Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run package:win:check
          npm run package:win
          node scripts/ci-release.mjs collect windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: music-share-windows-x64-${{ steps.release.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            arch: x64
            package: linux
          - runner: macos-15-intel
            target: macos-x64
            arch: x64
            package: mac
          - runner: macos-15
            target: macos-arm64
            arch: arm64
            package: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate version, tag, server URL and host architecture
        id: release
        env:
          CLIENT_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node -e "if(process.arch!==process.env.EXPECTED_ARCH)throw new Error('Runner architecture mismatch')"
          node scripts/ci-release.mjs prepare
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl zip unzip tar git file \
            patchelf binutils libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            libssl-dev libpipewire-0.3-dev libdbus-1-dev libfuse2 libudev-dev libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install pkg-config
          echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >> "$GITHUB_ENV"
          echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Install dependencies and run JavaScript tests
        run: |
          set -euo pipefail
          npm ci
          npm run test:version
          npm run test:ci-release
          npm run test:updater
          npm run test:packaging
          npm test
      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - name: Cache Cargo downloads and Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: desktop-rust-v1
          workspaces: apps/client/src-tauri -> target
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-${{ hashFiles('apps/client/src-tauri/Cargo.lock') }}
          env-vars: CARGO CC CFLAGS CXX RUST MACOSX_DEPLOYMENT_TARGET
          cache-targets: 'true'
          cache-workspace-crates: 'false'
          cache-bin: 'false'
          cache-on-failure: 'true'
      - name: Package desktop installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PACKAGE_PLATFORM: ${{ matrix.package }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          npm run "package:$PACKAGE_PLATFORM:check"
          npm run "package:$PACKAGE_PLATFORM"
          node scripts/ci-release.mjs collect "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: music-share-${{ matrix.target }}-${{ steps.release.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  release-draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-unix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: music-share-*-${{ needs.build.outputs.version }}
          path: downloaded-artifacts
      - name: Verify all four platform artifacts and merge release files
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.UPDATER_PUBLIC_KEY }}
        run: node scripts/ci-release.mjs merge
      - name: Create a draft release without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-artifacts/*)
          test "${#assets[@]}" -ge 7
          gh release create "$RELEASE_TAG" "${assets[@]}" --draft --verify-tag --title "共鸣 Music Share $RELEASE_TAG" --notes-file release-artifacts/RELEASE-NOTES.md
